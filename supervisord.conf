[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:privatemode-proxy]
; The API key is handed over in a memory-backed file (/dev/shm), not on the
; command line, where any process could read it from /proc/<pid>/cmdline.
; --listen-address=127.0.0.1: this binary has no authentication of its own, so
;   only the auth-proxy inside the container may reach it.
; --api-key-fallback=always: the auth-proxy never forwards client credentials,
;   so the binary must always use its own key (the upstream default is changing
;   to "never").
; Prompt-cache sharing and request dumping stay at their safe defaults (off).
command=/bin/sh -c '[ -n "$PRIVATEMODE_API_KEY" ] || { echo "PRIVATEMODE_API_KEY is not set" >&2; exit 1; }; umask 077 && printf %%s "$PRIVATEMODE_API_KEY" > /dev/shm/privatemode_api_key && exec /usr/local/bin/privatemode-proxy --api-key=@/dev/shm/privatemode_api_key --api-key-fallback=always --listen-address=127.0.0.1 --port=8081 --workspace=/app/workspace'
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:auth-proxy]
command=python /app/auth-proxy/server.py
directory=/app/auth-proxy
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=UPSTREAM_URL="http://127.0.0.1:8081"
